<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Жасанды интеллект: 20 тест</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f5f9;margin:0;padding:20px;color:#172033}
.container{max-width:800px;margin:auto;background:white;padding:25px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{color:#2457a6} .q{margin:22px 0;padding:18px;background:#f7f9fc;border-radius:12px}
label{display:block;margin:10px 0;padding:10px;background:white;border:1px solid #ddd;border-radius:8px;cursor:pointer}
button{background:#2457a6;color:white;border:0;padding:13px 22px;border-radius:9px;font-size:16px;cursor:pointer}
#result{font-size:20px;font-weight:bold;margin-top:20px}
small{color:#657}
</style></head><body><div class="container">
<h1>Жасанды интеллект ұғымы және оның қалыптасу тарихы</h1>
<small>20 сұрақ • Әр сұрақта 1 дұрыс жауап</small>
<form id="quiz"></form><button onclick="check(event)">Нәтижені тексеру</button><div id="result"></div>
</div>
<script>
const questions = [{"q": "Жасанды интеллект (ЖИ) дегеніміз не?", "a": ["Адам интеллектісіне тән міндеттерді орындайтын компьютерлік жүйелер", "Тек интернетке қосылу тәсілі", "Компьютердің сыртқы корпусы", "Тек ойын жасау бағдарламасы"], "correct": 0}, {"q": "«Жасанды интеллект» термині қай жылы ғылыми айналымға енді?", "a": ["1943", "1950", "1956", "1980"], "correct": 2}, {"q": "ЖИ терминін енгізген ғалым кім?", "a": ["Алан Тьюринг", "Джон Маккарти", "Билл Гейтс", "Стив Джобс"], "correct": 1}, {"q": "1956 жылғы маңызды ЖИ конференциясы қай жерде өтті?", "a": ["Дартмут колледжінде", "Оксфордта", "Мәскеуде", "Токиода"], "correct": 0}, {"q": "Алан Тьюринг 1950 жылы қандай идеяны ұсынды?", "a": ["Тьюринг тестін", "Интернетті", "Смартфонды", "Бұлттық сақтауды"], "correct": 0}, {"q": "Тьюринг тестінің негізгі мақсаты қандай?", "a": ["Машинаның адамға ұқсас сөйлесу қабілетін бағалау", "Компьютер жылдамдығын өлшеу", "Экран сапасын тексеру", "Жад көлемін есептеу"], "correct": 0}, {"q": "ЖИ дамуына негіз болған салалардың бірі қайсы?", "a": ["Математикалық логика", "Аспаздық өнер", "Спорттық жаттығу", "Музыка тыңдау"], "correct": 0}, {"q": "1943 жылы жасанды нейрон моделін зерттеген ғалымдар кімдер?", "a": ["Маккаллок пен Питтс", "Ньютон мен Эйнштейн", "Гейтс пен Джобс", "Шеннон мен Цукерберг"], "correct": 0}, {"q": "Алғашқы ЖИ зерттеулерінде қандай тәсіл кең қолданылды?", "a": ["Ережелер мен символдық логика", "Тек бейне түсіру", "Тек GPS пайдалану", "Тек дыбыс жазу"], "correct": 0}, {"q": "Эксперттік жүйе дегеніміз не?", "a": ["Маман білімін ережелер түрінде қолданатын жүйе", "Компьютердің қуат көзі", "Файлды сығу құралы", "Графикалық редактор"], "correct": 0}, {"q": "Машиналық оқыту дегеніміз не?", "a": ["Деректерден заңдылықтарды үйрену әдісі", "Компьютерді қолмен бояу", "Тек мәтінді көшіру", "Желіні өшіру"], "correct": 0}, {"q": "Терең оқыту көбіне неге сүйенеді?", "a": ["Көпқабатты нейрондық желілерге", "Тек калькуляторға", "Принтерге", "Файл атауына"], "correct": 0}, {"q": "«AI winter» ұғымы нені білдіреді?", "a": ["ЖИ-ге қызығушылық пен қаржыландырудың төмендеу кезеңін", "Қыс мезгіліндегі роботты", "ЖИ мерекесін", "Компьютердің қызып кетуін"], "correct": 0}, {"q": "Табиғи тілді өңдеу (NLP) не үшін қолданылады?", "a": ["Адам тілін түсіну және өңдеу үшін", "Тек сурет салу үшін", "Қуат өндіру үшін", "Пернетақтаны жөндеу үшін"], "correct": 0}, {"q": "Компьютерлік көру саласы нені зерттейді?", "a": ["Сурет пен бейнеден ақпарат тануды", "Компьютерді тасымалдауды", "Музыка аспаптарын жасауды", "Интернет тарифін"], "correct": 0}, {"q": "ЖИ-дің қазіргі қолданылуына қайсысы жатады?", "a": ["Ұсыным жүйелері", "Тек қағаз кітап басу", "Тек механикалық сағат", "Тек электр шамы"], "correct": 0}, {"q": "Деректер ЖИ жүйесінде қандай рөл атқарады?", "a": ["Оқыту мен шешім қабылдауға негіз болады", "Ешқандай рөл атқармайды", "Тек экранды безендіреді", "Компьютерді өшіреді"], "correct": 0}, {"q": "ЖИ жүйесінің қателесуінің бір себебі қандай?", "a": ["Сапасыз немесе біржақты деректер", "Пернетақтаның түсі", "Монитор өлшемі ғана", "Компьютердің маркасы ғана"], "correct": 0}, {"q": "ЖИ этикасына қатысты мәселе қайсы?", "a": ["Құпиялылық пен әділдік", "Экран жарықтығы ғана", "Кабель ұзындығы", "Пернетақта пішіні"], "correct": 0}, {"q": "ЖИ дамуының басты мақсатының бірі қандай?", "a": ["Интеллектуалдық міндеттерді автоматтандыру және шешуге көмектесу", "Барлық адамды міндетті түрде алмастыру", "Тек ойыншық жасау", "Интернетті жою"], "correct": 0}];
const form=document.getElementById('quiz');
questions.forEach((x,i)=>{
 let d=document.createElement('div'); d.className='q';
 d.innerHTML='<b>'+(i+1)+'. '+x.q+'</b>';
 x.a.forEach((a,j)=>{d.innerHTML+=`<label><input type="radio" name="q${i}" value="${j}"> ${a}</label>`;});
 form.appendChild(d);
});
function check(e){
 e.preventDefault(); let score=0, answered=0;
 questions.forEach((x,i)=>{let el=document.querySelector('input[name=q'+i+']:checked'); if(el){answered++;if(+el.value===x.correct)score++;}});
 document.getElementById('result').textContent='Нәтиже: '+score+'/20. Жауап берілгені: '+answered+'/20.';
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script></body></html>
